---
# defaults file for zookeeper

zookeeper_version: '3.5.9'
zookeeper_url: https://mirrors.huaweicloud.com/apache/zookeeper/zookeeper-{{zookeeper_version}}/apache-zookeeper-{{zookeeper_version}}-bin.tar.gz

# zoo.cfg
tickTime: 2000
initLimit: 10
syncLimit: 5
clientPort: 2181
maxClientCnxns: 60
zookeeper_cluster_ports: "2888:3888"

# PATH
data_dir: /data/zookeeper-data
zookeeper_dir: /data/zookeeper
zookeeper_force_myid: yes


java_hoame: '/usr/local/java'


# User
user: zookeeper
group: zookeeper


# When yes cleans zookeeper installation
clean: no
